<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <!-- <script src="products.js"></script> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <div id="app">
        <div v-if="showProduct">
            <h1 v-text = "sitename"></h1>
            <button @click="toggleCheckout">  <i class="fa fa-shopping-cart" aria-hidden="true"></i> Checkout ({{cartItemCount}})</button>
            
            <!-- Product information -->
            <div v-for="product in sortedProducts">
                <figure>
                    <img v-bind:src="product.image" width = 300>
                </figure>
                <h2 v-text="product.title"></h2>
                <p v-text="product.description"></p>
                <p>Price: £{{product.price}}</p>
                <p>{{product.availableInventory}} available.</p>
                <p>{{cartProductCount(product.id)}} in cart.</p>
                 <button v-on:click="addItem(product)" v-bind:disabled="!canAddToCart(product)">Add to Cart</button>
            </div>

        </div>  
        <div v-else>
            <h1>Checkout Page</h1>
            <button @click="toggleCheckout"> Return to store </button>

            <p>Title:
                <select v-model="order.title">
                    <option v-for="title in titles">{{title}}</option>
                </select>
            </p>
            <p>First Name: <input v-model="order.firstName"></p>
            <p>Last Name: <input v-model="order.lastName"></p>

            <p>Phone Number: <input v-model="order.telephone"> </p>

            <h2>Summary</h2>
            <p>{{order.title}} {{order.firstName}} {{order.lastName}}</p>
            <p>Telephone: {{order.telephone}}</p>
        </div>   
     
    </div>

    <script type="module">
        const {createApp} = Vue
        const petstore = createApp({
            data(){
                return{
                    sitename: "Vue.js Pet Depot",
                    products: [],
                    cart:[],
                    showProduct: true,
                    order:{
                        firstName:"",
                        lastName:"",
                        telephone:"",
                        title:""
                    },
                    titles:["Dr","Miss","Mr","Mrs","Ms","Mx"]
                }
            },
            computed:{
                cartItemCount:function(){
                    return this.cart.length;
                },
                sortedProducts:function(){
                    function compare(a,b){
                        if (a.price > b.price) return 1;
                        if (a.price < b.price) return -1;
                        return 0;
                    }
                    return this.products.sort(compare);
                }
            },
            created(){
                this.fetchData();
            },
            methods:{
                async fetchData(){
                    const url = "http://localhost:3000/";
                    let response = await (fetch (url));
                    this.products = await response.json();
                },
                addItem(product){
                    this.cart.push(product.id);
                },
                toggleCheckout(){
                    this.showProduct = this.showProduct ? false : true;
                },
                cartProductCount(id){
                    let count = 0;
                    for(let i = 0; i < this.cart.length; i++) {
                        if (this.cart[i] === id) {
                         count++;
                        }
                    }
                    return count;
                },
                canAddToCart(product){
                    return this.cartProductCount(product.id) < product.availableInventory;
                },
            }
        })
        petstore.mount('#app')
    </script>
    
</body>
</html>
